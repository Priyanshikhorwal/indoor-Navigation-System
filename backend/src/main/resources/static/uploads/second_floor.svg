<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
    <style>
        .bg { fill: #f8fafc; }
        .wall { fill: none; stroke: #cbd5e1; stroke-width: 4; stroke-linejoin: round; }
        .room-bg { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 8px; }
        .room-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
        .room-number { font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 500; fill: #94a3b8; }
    </style>

    <!-- Background -->
    <rect width="800" height="550" class="bg" />

    <!-- Grid Pattern -->
    <defs>
        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1.5" />
        </pattern>
    </defs>
    <rect width="800" height="550" fill="url(#grid-pattern)" />

    <!-- Corridors / Pathways -->
    <path d="M 150,250 L 300,250 L 300,300 L 450,300 L 450,200 L 600,200 L 600,300 L 600,150 L 300,150" 
          fill="none" stroke="#e2e8f0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M 150,250 L 300,250 L 300,300 L 450,300 L 450,200 L 600,200 L 600,300 L 600,150 L 300,150" 
          fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Room: Conference Room -->
    <rect x="100" y="210" width="100" height="80" class="room-bg" />
    <text x="150" y="245" text-anchor="middle" class="room-label">Conf. Room</text>
    <text x="150" y="265" text-anchor="middle" class="room-number">ROOM 200</text>

    <!-- Room: Lobby F2 -->
    <rect x="220" y="260" width="160" height="80" class="room-bg" style="fill: #fdfdfd; stroke: #64748b;" />
    <text x="300" y="295" text-anchor="middle" class="room-label" style="fill: #334155; font-size: 13px;">Lobby F2</text>
    <text x="300" y="315" text-anchor="middle" class="room-number">LOUNGE</text>

    <!-- Room: Lab 201 -->
    <rect x="400" y="160" width="100" height="80" class="room-bg" />
    <text x="450" y="195" text-anchor="middle" class="room-label">Lab 201</text>
    <text x="450" y="215" text-anchor="middle" class="room-number">ROOM 201</text>

    <!-- Room: Office 202 -->
    <rect x="250" y="110" width="100" height="80" class="room-bg" />
    <text x="300" y="145" text-anchor="middle" class="room-label">Office 202</text>
    <text x="300" y="165" text-anchor="middle" class="room-number">ROOM 202</text>

    <!-- Elevator F2 -->
    <rect x="560" y="260" width="80" height="80" class="room-bg" style="fill: #eff6ff; stroke: #3b82f6;" />
    <text x="600" y="295" text-anchor="middle" class="room-label" style="fill: #1e3a8a;">Elevator</text>
    <text x="600" y="315" text-anchor="middle" class="room-number" style="fill: #3b82f6;">LEVEL 2</text>

    <!-- Stairs F2 -->
    <rect x="560" y="110" width="80" height="80" class="room-bg" style="fill: #fff7ed; stroke: #f97316;" />
    <text x="600" y="145" text-anchor="middle" class="room-label" style="fill: #7c2d12;">Stairs</text>
    <text x="600" y="165" text-anchor="middle" class="room-number" style="fill: #f97316;">LEVEL 2</text>

    <!-- Outer Building Walls -->
    <rect x="50" y="50" width="700" height="450" class="wall" />
</svg>
