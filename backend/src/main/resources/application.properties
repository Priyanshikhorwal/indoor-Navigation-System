# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/indoor_navigation
spring.datasource.username=postgres
spring.datasource.password=prabhat
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# Using 'update' so Hibernate auto-creates/aligns tables from entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Flyway =====
# Disabled: migration SQL was out of sync with entity column names; Hibernate handles DDL
spring.flyway.enabled=false

# ===== Server =====
server.port=8080

# ===== JWT =====
# JWT Configuration \u2014 valid Base64 256-bit secret
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6e8a3d9
jwt.expiration=86400000

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads

# ===== CORS (allow React frontend) =====
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

# ===== Logging =====
logging.level.com.project=DEBUG
logging.level.org.springframework.security=INFO
